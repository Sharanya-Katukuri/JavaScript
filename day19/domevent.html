<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom_events</title>
    <style>
        .box{
            width: 80px;
            height: 80px;
            margin-left: 20px;
            background-color: rgb(156, 247, 222);
            border: 2px solid black;
        }
        .dark-mode {
            background: #222;
            color: white;
        }
        .done {
            color: green;
            font-weight: bold;
        }
        li {
            margin: 5px 0;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- task1 -->
    <button id="btn" onclick="fun1()">Hide</button>
    <p id="para">This is paragraph..</p><br> <br>

    <!-- Task 2: onmouseover + onmouseout + document.getElementsByClassName
 -->
    <div class="box"></div><br><br>
    <div class="box"></div><br><br>
    <div class="box"></div><br><br>

    <!-- Task 3: onfocus + onchange + document.getElementsByTagName
 -->

 <input type="text">
 <input type="text">
 <input type="text"> <br><br>
 <span id="msg"></span> <br><br>

<!-- Task 4: onsubmit + document.querySelector + document.querySelectorAll
 -->

 <form action="" id="myform">
    <input type="text" id="name" placeholder="Name"><br><br>
    <input type="text" id="email" placeholder="Email"><br><br>
    <input type="text" id="age" placeholder="Age"><br><br>
    <button id="submitbtn">Submit</button>
 </form>
 <div id="message"></div>


 <!-- Task 5: Setup theme radio buttons -->
<h3>select Theme:</h3>
<label for="">
    <input type="radio" name="theme" value="Light">Light
</label>
<label for="">
    <input type="radio" name="theme" value="Dark">Dark
</label>
<div id="themeMsg" style="margin-top: 10px; font-weight: bold;"></div>

    <ul id="taskList">
        <li>Task A</li>
        <li>Task B</li>
    </ul>

    <input type="text" id="newTask" placeholder="Enter new task">
    <button id="addTaskBtn" disabled>Add Task</button>

    
</body>
<script>
    // Task 1
    function fun1(){
        let para=document.getElementById("para")
        let btn=document.getElementById("btn")
        if(para.style.display==="none"){
            para.style.display="block";
            btn.textContent="Hide";
        }
        else{
            para.style.display="none"
            btn.textContent="Show again"
        }
    }

    // Task 2: onmouseover + onmouseout + document.getElementsByClassName

    let boxes=document.getElementsByClassName("box");
    for(let box of boxes){
        box.onmouseover=()=>{
            box.style.transform="scale(1.3)"
        };
        box.onmouseout=()=>{
            box.style.transform="scale(1)"
        };
        box.onclick=()=>{
            box.style.background="orangered"
        }
    }


    // Task 3: onfocus + onchange + document.getElementsByTagName

    let inputs=document.getElementsByTagName("input");
    let msg=document.getElementById("msg");
    for(let inp of inputs){
        inp.onfocus=function (){
            inp.style.background="pink"
        }
        inp.onchange=function(){
            let value=inp.value.trim();
            if(value.length<3){
                msg.textContent="ERROR: enter at least 3 characters"
                msg.style.color="red"
            }
            else{
                msg.textContent="ok";
                msg.style.color="green"

                inp.style.background="yellow"

            }
        }
    }

    // Task 4: onsubmit + document.querySelector + document.querySelectorAll

    let form=document.querySelector("#myform")
    let ip=document.querySelectorAll("#myform input")
    let message=document.getElementById("message")
    let submitBtn=document.getElementById("submitbtn")

    form.onsubmit=function(event){
        let name=ip[0].value
        let email=ip[1].value
        let age=ip[2].value

        if(name.length<2){
            message.textContent="name must be at least 2 characters"
            message.style.color="red"
            return false

        }
        if(!email.includes("@")){
            message.textContent="Email must contain @"
            message.style.color="red"
            return false
        }
        if(isNaN(age)||Number(age)<=0){
            message.textContent="Age must be a number greater than 0"
            message.style.color="red"
            return false
        }
        message.textContent=`welcome ${name}!`;
        message.style.color="green"

        form.reset()

        submitBtn.disabled=true;
        return false
    }

    // Task 5: Setup theme radio buttons

    let radios=document.getElementsByName("theme")
    let msgs = document.querySelector("#themeMsg");
    let currentTheme = "Light"; 
    for(let r of radios){
        r.onchange=function(){
            currentTheme=r.value;
            msgs.textContent="Current theme:"+r.value;
            if(r.value=="Dark"){
                document.body.classList.add("dark-mode")
            }else{
                document.body.classList.remove("dark-mode")
            }

        }
    }
    
        window.onbeforeunload = function () {
            return "Do you really want to leave with " + currentTheme + " mode?";
        };

    // tak-6

        let taskList = document.getElementById("taskList");
        let newTask = document.getElementById("newTask");
        let addBtn = document.getElementById("addTaskBtn");

        
        function applyHandlers(li) {

        
            li.onmouseover = function () {
                li.style.textDecoration = "underline";
            };

            
            li.onmouseout = function () {
                li.style.textDecoration = "none";
            };

           
            li.onclick = function () {
                li.classList.add("done");
                li.style.textDecoration = "none";
                li.onclick = null;   
            };
        }

        
        let liItems = document.querySelectorAll("#taskList li");
        for (let li of liItems) {
            applyHandlers(li);
        }

        addBtn.onclick = function () {

            let text = newTask.value.trim();

            if (text === "") {
                alert("Please enter a task!");
                return;
            }

            let newLi = document.createElement("li");
            newLi.textContent = text;

        
            applyHandlers(newLi);

            taskList.appendChild(newLi);

            newTask.value = "";
            addBtn.disabled = true;
        };

        newTask.onchange = function () {
            if (newTask.value.trim().length >= 3) {
                addBtn.disabled = false;
            } else {
                addBtn.disabled = true;
            }
        };
</script>
</html>

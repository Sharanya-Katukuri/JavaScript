<body>
    <script>
        // ------------map()---------------
        // Multiply Elements
        var arr1=[2,4,6,8]
        console.log(arr1.map((number)=>number*10))

        // Extract Names

        var arr2=[
            {name: "Ram", age: 20},
            {name: "Sita", age: 22}
                ]
        console.log(arr2.map((val)=>val.name))

        // Square All Numbers
        var arr3=[3, 5, 7, 9]
        console.log(arr3.map((num)=>num**2))



        // --------------filter()--------------
        // Filter Even Numbers

        var arr4=[2,1,3,6,11,42,78,65,46,55,79,98,200]
        console.log(arr4.filter((num)=>num%2==0))

        // Students With Marks > 75

        var arr5=[
                {name: "Arun", marks: 80},
                {name: "Ravi", marks: 60},
                {name: "Kavi", marks: 90}
                ]
        console.log(arr5.filter((obj1)=>obj1.marks>75))

        // Filter Strings with Length > 5
        var arr6=["apple", "cat", "banana", "dog", "elephant"]
        console.log(arr6.filter((arr)=>arr.length>5))



        // ----------reduce()-------
    
        //  Find Total Price
        const prices = [150, 200, 350, 100]
        console.log(prices.reduce((x,y)=>x+y,0))

        //  Count Total Characters

        var arr7= ["js", "react", "node"]
        console.log(arr7.reduce((a,b)=>a+b.length,0))

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // ----map()-------
        var arr1=[1,2,3,4,5,6]
        console.log(arr1.map((number)=>number*5))
        console.log(arr1.map((num)=>num**2))
        console.log(arr1.map((number)=>number**3))


        // -------filter()--------
        var arr2=[3,43,54,23,12,67,87,32,42,31,69,50,55,95,2,5,4]
        console.log(arr2.filter((number)=>number>50))
        console.log(arr2.filter((number)=>number<50))
        console.log(arr2.filter((number)=>number%5==0))

        // -------reduce()-------
        var arr3=[2,4,5,6,7,8,9,1,11,54,32,15,3,10]
        console.log(arr3.reduce((acc,cur)=>acc+cur,0))
        console.log(arr3.reduce((acc,cur)=>acc+cur))
        console.log(arr3.reduce((acc,cur)=>acc*cur))
    </script>
</body>
</html>

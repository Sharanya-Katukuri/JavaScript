<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>products</title>
</head>
<body>
<div id="products" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap:10px;column-gap: 80px;"></div>    <script>
        async function fetchdata(){
            let response=await fetch("https://fakestoreapi.com/products")
            let result=await response.json()
            console.log(result)
            let prod=document.getElementById("products")
            prod.innerHTML=""
            result.forEach((product)=>{
                // document.write(product)
                prod.innerHTML+=`<div style="width:300px; border:1px solid black;padding:10px;margin:10px"> 
                    <h2>${product.title}</h2>
                    <img src="${product.image}" style="width:150px">
                    <h3>price:${product.price}</h3>
                    <h3>${product.category}</h3>
                    <p>${product.description}<p>
                    </div>`


            })
        }
        fetchdata()
    </script>
    
</body>
</html>
